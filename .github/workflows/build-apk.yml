name: Build APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v3
      
      - name: ☕ 设置JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle
      
      - name: ✅ 验证Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            echo "❌ gradlew 文件缺失"
            exit 1
          fi
          chmod +x gradlew
      
      - name: 🔨 构建Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace
      
      - name: 📦 上传Debug APK
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      
      - name: 📊 获取APK信息
        if: success()
        run: |
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_FILE" ]; then
            APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
            echo "✅ APK构建成功！"
            echo "📦 APK文件大小: $APK_SIZE"
            echo "📂 位置: $APK_FILE"
          fi
      
      - name: ❌ 构建失败日志
        if: failure()
        run: |
          echo "构建失败，请检查日志"
          if [ -f "app/build/reports/lint-results-debug.html" ]; then
            echo "lint报告: app/build/reports/lint-results-debug.html"
          fi

  build-release:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v3
      
      - name: ☕ 设置JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle
      
      - name: ✅ 验证Gradle Wrapper
        run: |
          chmod +x gradlew
      
      - name: 🔨 构建Release APK
        run: |
          ./gradlew assembleRelease --stacktrace
        continue-on-error: true
      
      - name: 📦 上传Release APK
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
      
      - name: 📝 生成构建报告
        if: always()
        run: |
          echo "## 📱 APK构建报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Debug APK" >> $GITHUB_STEP_SUMMARY
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            APK_SIZE=$(du -h "app/build/outputs/apk/debug/app-debug.apk" | cut -f1)
            echo "✅ 构建成功 - 大小: $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ 未找到Debug APK" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release APK" >> $GITHUB_STEP_SUMMARY
          if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            APK_SIZE=$(du -h "app/build/outputs/apk/release/app-release-unsigned.apk" | cut -f1)
            echo "✅ 构建成功 - 大小: $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️  Release APK 可能需要签名配置" >> $GITHUB_STEP_SUMMARY
          fi
